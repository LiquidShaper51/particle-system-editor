[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "particle-system-editor"
version = "0.6.2"
description = "Windows desktop particle system editor: ingest, process, and export particle graphs."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "particle-system-editor contributors" }]
keywords = ["particles", "vfx", "editor", "graph", "emitter"]

dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10"]
native = ["particle-emitter-native>=0.3"]

[project.scripts]
particle-editor = "particle_system_editor.bootstrap.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=particle_system_editor"